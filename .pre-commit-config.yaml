# Pre-commit hooks: block a commit that contains a secret or an obvious flaw.
# Install once:  pip install pre-commit   then   pre-commit install
# Run on everything:  pre-commit run --all-files
repos:
  # 1) Secrets detection (blocking)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # 2) Generic safety checks (blocking)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key        # PEM/SSH private keys
      - id: check-added-large-files   # accidental dumps/binaries
      - id: check-merge-conflict
      - id: check-yaml

  # 3) Obvious code flaws: ESLint with the security plugin (blocking on errors)
  - repo: local
    hooks:
      - id: eslint-security
        name: ESLint (security rules)
        entry: npx eslint --quiet
        language: system
        files: \.(js|jsx|ts|tsx|mjs)$